<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthdayyyy Mummie 🎉</title>

  <!-- Festive Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ffd6e8, #ffeef6);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.311);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      max-width: 500px;
    }

    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 3em;
      color: #ff5fa2;
      margin-bottom: 30px;
    }

    p {
      font-size: 1.1em;
      margin-bottom: 30px;
      color: #555;
    }

    .photo-container {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto 30px;
      border: 5px solid #ff596c6d;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .photo-container:hover img {
      transform: scale(1.05);
    }

    button {
      color: #999;
      background:       color#999;
;
      color: #333;
      border: none;
      padding: 12px 30px;
      font-size: 16px;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.3s;
      margin: 10px;
    }

    button:hover {
      background: #ff5fa2;
      transform: scale(1.05);
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #ff6b6b;
      border-radius: 50%;
      opacity: 0.7;
      animation: confetti-fall 6s linear infinite;
    }

    @keyframes confetti-fall {
      0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="photo-container">
      <img src="https://www.dropbox.com/scl/fi/6bmvmpw9y100henhvmskb/WhatsApp-Image-2026-02-15-at-16.58.10.jpeg?rlkey=t3l6hhys0umhew194zvr0wk3w&raw=1" alt="MY QUEEN 💕" id="birthday-photo">
    </div>
    <h1>Happy Birthday, Mummie! 🎉</h1>
    <p><p>Another year older, another year better! I'm so grateful to have you in my live. May this year bring you joy, success, and all the happiness you deserve!</p></p>
    <button onclick="alert('Happy Birthday MOM! 🎁'); createConfetti()">Celebrate!</button>
  </div>

  <script>
    function createConfetti() {
      for (let i = 0; i < 50; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
        confetti.style.backgroundColor = ['#ff6b6b', '#ffde59', '#4ecdc4', '#94b1ff', '#ff85c0'] [Math.floor(Math.random() * 5)];
        document.body.appendChild(confetti);
        
        setTimeout(() => {
          confetti.remove();
        }, 5000);
      }
    }

    // Replace the placeholder image with your actual image
    // Update the alt text and src as needed
    document.addEventListener('DOMContentLoaded', function() {
      // This is where you'd replace the placeholder with your actual image
      // For example: document.getElementById('birthday-photo').src = 'your-image.jpg';
    });
  </script>
</body>
</html>
